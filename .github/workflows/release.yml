name: Build and publish Linux release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-deb:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg rubberband-cli python3-venv dpkg-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - name: Create Python environment
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r requirements.txt pyinstaller

      - name: Build Debian package
        env:
          STEMKART_VERSION: 0.1.0~beta1
        run: ./packaging/linux/build_deb.sh dist/release

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: stemkart-linux-deb
          path: dist/release/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/release/* --title "StemKart ${GITHUB_REF_NAME}" --generate-notes --prerelease
